services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: outreachpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: outreachpilot
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outreachpilot"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://outreachpilot:${POSTGRES_PASSWORD}@db:5432/outreachpilot
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports: ["80:80"]
    depends_on: [backend]
    restart: unless-stopped

volumes:
  pgdata:
