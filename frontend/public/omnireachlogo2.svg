<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#09090B" rx="20"/>

  <!-- Modern gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099FF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Abstract network/nodes design -->
  <circle cx="100" cy="80" r="20" fill="url(#grad1)"/>
  <circle cx="70" cy="130" r="15" fill="url(#grad1)" opacity="0.8"/>
  <circle cx="130" cy="130" r="15" fill="url(#grad1)" opacity="0.8"/>

  <!-- Connection lines -->
  <line x1="100" y1="80" x2="70" y2="130" stroke="url(#grad1)" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="80" x2="130" y2="130" stroke="url(#grad1)" stroke-width="2" opacity="0.6"/>
  <line x1="70" y1="130" x2="130" y2="130" stroke="url(#grad1)" stroke-width="2" opacity="0.4"/>

  <!-- Text: Om initials -->
  <text x="100" y="90" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#09090B" text-anchor="middle">O</text>

  <!-- Glow -->
  <circle cx="100" cy="80" r="22" fill="none" stroke="url(#grad1)" stroke-width="1" opacity="0.3"/>
</svg>